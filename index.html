    <style>
        body {
            background: linear-gradient(135deg, #e6deff 0%, #f9f9ff 50%, #c6e7ff 100%);
            min-height: max(884px, 100dvh);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(112, 88, 208, 0.08);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(112, 88, 208, 0.1);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(112, 88, 208, 0.2);
            border-radius: 10px;
        }

            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: rgba(112, 88, 208, 0.4);
            }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* SPA Transitions */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

            .view-section.active {
                display: block;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Play Animation */
        @keyframes pulseGlow {
            0% {
                transform: scale(0.9) translateY(16px);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.05) translateY(16px);
                opacity: 0.7;
            }

            100% {
                transform: scale(0.9) translateY(16px);
                opacity: 0.3;
            }
        }

        .playing-glow {
            animation: pulseGlow 2s infinite ease-in-out !important;
        }
    </style>
</head>
<body class="font-body-md text-on-surface">

    <!-- ========================================== -->
    <!-- SCREEN B: LIBRARY / HOME                   -->
    <!-- ========================================== -->
    <div id="library-view" class="view-section active">
        <!-- TopAppBar -->
        <header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-white/40">
            <div class="flex justify-center items-center w-full px-6 py-4">
                <h1 class="font-bold text-2xl text-violet-700">حكاياتي</h1>
            </div>
        </header>

        <main class="pt-24 pb-12 px-md">
            <!-- Hero Section -->
            <div class="mb-lg text-center">
                <h2 class="font-headline-lg text-headline-lg text-primary-container mb-xs">المكتبة السحرية</h2>
                <p class="font-body-md text-body-md text-on-surface-variant opacity-80">اكتشف عالم الألحان والقصص</p>
            </div>

            <!-- Bento Grid -->
            <div id="songs-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-md max-w-7xl mx-auto">
                <!-- Cards will be injected here via JavaScript -->
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SCREEN A: SONG PLAYER / DEEP LINK          -->
    <!-- ========================================== -->
    <div id="song-view" class="view-section">
        <!-- TopAppBar -->
        <header class="fixed top-0 left-0 w-full z-50 glass-panel border-b border-white/40">
            <div class="flex justify-between items-center w-full px-6 py-4 rtl">
                <div class="flex items-center gap-2">
                    <button onclick="navigateHome()" class="w-[48px] h-[48px] flex items-center justify-center text-violet-600 hover:opacity-80 active:scale-95 transition-all bg-white/30 rounded-full">
                        <span class="material-symbols-outlined text-2xl">arrow_forward</span>
                    </button>
                </div>
                <h1 id="player-title" class="font-bold text-lg text-violet-700 truncate max-w-[200px]">عنوان الأغنية</h1>
                <div class="flex items-center gap-2">
                    <div class="w-[48px] h-[48px]"></div> <!-- Placeholder for symmetry -->
                </div>
            </div>
        </header>

        <main class="pt-24 pb-24 px-md flex flex-col items-center gap-8 max-w-2xl mx-auto min-h-screen">

            <!-- Central 3D Illustration -->
            <div class="relative w-full aspect-square max-w-[280px] group mt-4 shrink-0">
                <div id="player-glow" class="absolute inset-0 bg-primary-container/30 rounded-[40px] blur-3xl transform scale-90 translate-y-4 transition-all duration-700"></div>
                <div class="relative w-full h-full glass-panel rounded-[40px] overflow-hidden p-3 shadow-xl">
                    <img id="player-img" class="w-full h-full object-cover rounded-[32px] transition-transform duration-700 hover:scale-105" src="" alt="Song Illustration" />
                </div>
            </div>

            <!-- Audio Player Controls -->
            <div id="audio-controls-container" class="w-full flex flex-col gap-6 shrink-0 px-4">
                <!-- Progress Bar -->
                <div class="w-full flex flex-col gap-2">
                    <div id="progress-container" class="relative h-4 w-full bg-surface-container rounded-full overflow-hidden cursor-pointer shadow-inner" onclick="seek(event)">
                        <div id="progress-bar" class="absolute left-0 top-0 h-full w-[0%] bg-primary-container rounded-full transition-all duration-100 ease-linear"></div>
                        <div id="progress-head" class="absolute top-1/2 -translate-y-1/2 w-5 h-5 bg-white border-[3px] border-primary-container rounded-full shadow-md transition-all duration-100 ease-linear" style="right: 0%;"></div>
                    </div>
                    <div class="flex justify-between px-1" dir="ltr">
                        <span id="time-current" class="text-label-sm text-outline font-mono">00:00</span>
                        <span id="time-total" class="text-label-sm text-outline font-mono">00:00</span>
                    </div>
                </div>

                <!-- Player Buttons -->
                <div class="flex items-center justify-center gap-xl">
                    <button onclick="skip(-10)" class="w-[48px] h-[48px] flex items-center justify-center text-primary-container hover:opacity-80 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-3xl">replay_10</span>
                    </button>

                    <button onclick="togglePlay()" id="btn-play" class="w-20 h-20 bg-primary-container text-white rounded-full flex items-center justify-center shadow-[0_12px_24px_rgba(112,88,208,0.3)] hover:scale-105 active:scale-90 transition-transform">
                        <span id="icon-play" class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    </button>

                    <button onclick="skip(10)" class="w-[48px] h-[48px] flex items-center justify-center text-primary-container hover:opacity-80 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-3xl">forward_10</span>
                    </button>
                </div>
            </div>

            <!-- No Audio Message (Hidden by default) -->
            <div id="no-audio-message" class="hidden w-full flex-col items-center justify-center py-6 px-6 glass-panel rounded-3xl border-dashed border-2 border-primary/30 shrink-0">
                <span class="material-symbols-outlined text-5xl text-primary/50 mb-3">music_off</span>
                <p class="font-headline-md text-primary font-bold text-center mb-1">الأغنية غير متوفرة حالياً</p>
            </div>

            <!-- Lyrics Section -->
            <section class="w-full pb-8">
                <div class="glass-panel rounded-[32px] p-6 sm:p-8 shadow-sm h-auto">
                    <h3 class="text-center text-primary font-headline-md mb-6">كلمات الأغنية</h3>
                    <div id="player-lyrics" class="flex flex-col gap-5 text-center text-on-surface">
                        <!-- Lyrics injected via JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>
